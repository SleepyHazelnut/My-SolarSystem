<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>黑洞本体 × 吸积盘 · v12（深空/引力透镜/吸积流线/坠落）</title>
<style>
  html,body{margin:0;height:100%;background:#F7F6F9;color:#26232F;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  #stage{width:min(80vh,76vw);aspect-ratio:1/1}
  svg{width:100%;height:100%;display:block}
  .bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:center;padding:0 16px 18px}
  button{border:1px solid #D8D3E4;background:#fff;color:#4B4560;border-radius:8px;
    padding:7px 14px;font-size:13px;cursor:pointer;transition:.15s;font-family:inherit}
  button:hover{border-color:#9B8CD6}
  button.on{background:#5B45C4;border-color:#5B45C4;color:#fff}
  .sep{width:1px;height:20px;background:#DED9EA;margin:0 4px}
  .ro{font-size:11.5px;color:#8A8699;font-family:Consolas,monospace;padding-left:6px}
  /* v11 深空模式：页面一起转夜场，否则画面是一块「黑方片」贴在白纸上，
     那比白纸更出戏。按钮同步反色。 */
  body.sky{background:#06050A;color:#E9E5FF}
  body.sky button{border-color:#332E4C;background:#151223;color:#C6BFE6}
  body.sky button:hover{border-color:#7B6BC0}
  body.sky button.on{background:#6E56DC;border-color:#6E56DC;color:#fff}
  body.sky .sep{background:#2A2740}
  body.sky .ro{color:#726C93}
</style>
</head>
<body>
<div id="stage"><svg id="art" viewBox="0 0 1920 1920" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div class="bar">
  <button id="bPlay" class="on">暂停</button>
  <button id="bReplay">重播入场</button>
  <div class="sep"></div>
  <button id="s05">0.5×</button>
  <button id="s1" class="on">1×</button>
  <button id="s2">2×</button>
  <div class="sep"></div>
  <button id="bLine">墨线</button>
  <button id="bOrbit">轨道</button>
  <button id="bReal">真实模式</button>
  <span class="ro" id="ro"></span>
</div>

<script>
/* ===================================================================
   v9：在 v8 用户定标参数之上叠加「真实感」层，构图与色板一字未改。
   倾角 -20° · 扁率 0.75 · 盘心 (1083,923) · 本体 r=370 @ (1083,913) · 压扁 0.92
   -------------------------------------------------------------------
   新增六项（全部平涂风格，不用 blur/gradient 滤镜）：
   P0 光子环：球缘两道平涂亮环（#FEEB99 7px + #FCA346 3px），挂在
      gBodyPos 里随本体定位/压扁，五官之下。
   P1 引力透镜：远侧弧的「弯折像」——点质量透镜方程 θ± = (β±√(β²+4L²))/2
      的风格化版。远侧弧压到紧贴视界的窄带（上半弧 gHalo，本体前、近盘后）；
      内缘亮环的镜像副像绕到视界下缘（gHaloLow，最前层）。近侧光不弯。
   P2 坠落：行程末段（内盘 ISCO=1.55 以内）切入 EASE_PLUNGE 纯 ease-in
      俯冲——起步导数 0 与主曲线速度连续、末端导数 ∞；半径收敛到视界，
      角速度按开普勒联动追加扫角，潮汐拉伸变长变细，压暗一档（引力红移），
      屏幕距离进入光子环内侧即被「吞掉」（不再透明度溶掉）。
      外盘弧收尾改为向内倾斜（kd 负偏 + 微拉伸），读作整体向内的物质流。
   P3 吸入物：26 颗碎片沿对数螺旋坠入（盘面内、前后分景深）；每 15~25s
      一次潮汐流事件（长带从外缘被拽入拉伸吞没）；静态星场一次性烘入
      透镜位移——洞周净空 + 密度向爱因斯坦环堆积，零每帧成本。
   P4 多普勒：亮度按 cos(φ−φ_approach) 调制（±18%，只动不透明度不动色板）。
   P5 结构：整体公转 ROT（净角位移不再为零）；呼吸改径向（内强外弱）。
      「真实模式」开关：藏五官只留光子环。
   -------------------------------------------------------------------
   f5m 模型 · N=78 S=0.98 width=1.05 lobe=0.90 色板/权重/驻留与 v8 完全一致
   -------------------------------------------------------------------
   v10：按真实渲染器的做法补「活着的细节」，两条，全部低幅度：
   1) 光子环热点：两串短亮弧沿环滑行（3 处 / 5 处，速度 46 / 27 px·s⁻¹，
      节拍按椭圆周长 Ramanujan 精确等分，避免接缝豁口）。热点必须叠在
      亮边上——单独成层 gBeadL 插在 gFront 之后，否则被内缘黄弧盖掉；
      画在阴影内部会读成一道划痕。环本身再加慢脉动（0.83 / 1.37 rad·s⁻¹）。
   2) 高阶像堆叠：真实高阶像渐近挤向临界曲线，所以是在阴影内部再收两层
      细环（330 / 318）只留辉光；盘面上的弯折像只保留一阶 ——
      二、三阶在 4.7px/单位下无对比度可读。
   修掉的 bug：弯折像原本用「填充带 + 径向压缩」，内/外轮廓自交，
   nonzero 填充在交叠处挖洞，洞后面正是黑球 → 阴影边缘（3 点钟最明显）
   出现暗色划痕。改成中线 + 描边（centerline），永不自交。
   -------------------------------------------------------------------
   v11/v12：补「黑洞感」缺的两件事 —— 介质和路径。五官保留（拟人化是精华）。
   v11 深空模式（默认；加 ?paper 回到白纸版）：
     1) 深空底 + 暗角：白纸上的黑圆是贴纸，深空里的黑圆才是洞。
     2) 星场 70→900 颗，θE 180→240，并按「落到哪个半径」决定画法：
        贴近临界曲线的星画成**切向短弧**（点光源被拉成沿环的弧）。
        修掉 v9 的概念错误 —— 原来把 d<240 全丢掉，而那正是唯一的强透镜区，
        剩下的只是弱场平移 θ≈β+θE²/β，形变为零，透镜等于白做。
     3) 径向亮度梯度（内 100% → 外 48%）：平涂只有不透明度这一条亮度通道。
     4) 多普勒 14%→38%（暗底上「变暗」直接露黑，观感强得多）。
     5) 极向喷流：10 段等分色阶拼出渐淡，不用 gradient。
     6) 视界内两条 k<1 穿洞带 op=0 —— 视界以内不该有物质可见。
   v12 吸积流线（?noflow 可关）：
     22 条对数螺旋从盘外缘绕进视界（k 2.05→1.10，0.7~1.3 圈，u^0.8 收紧）。
     每条两层：极淡的连续线勾出路径 + 移动的亮块表示流动；
     dashoffset 沿路径向内推进 = 物质一块块被拽进去。
     没有路径只有速度，眼睛读不出「吸」，只能读出「转」—— 这是关键的一条。
     颜色分介质：深空用发光浅色，纸感用珊瑚/赭色（奶油色压白纸等于没画）。
   =================================================================== */
const CX = 1083, CY = 923, A = 338, SIG = 0.75, TILT = -20 * Math.PI / 180;
const CT = Math.cos(TILT), ST = Math.sin(TILT);
const NS = 'http://www.w3.org/2000/svg';
const INK = '#241741';

/* f5m 的色板：浅紫 #B068D2 是主色（不是深紫），配鲑红/浅黄/橙。
   「顺眼」很大一部分来自这里 —— 深紫一上，整盘就沉、就闷。 */
const BANDS  = ['#FEEB99', '#FCA346', '#F68380', '#F4789B', '#B068D2'];
const WEIGHT = [0.17, 0.14, 0.10, 0.13, 0.46];
/* 底层色 = 同色相压暗 45%，只用来给弧的内侧压一道边，颜色不换相 */
const darken = (hex, k) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.round(v * k);
  return '#' + [f(n >> 16 & 255), f(n >> 8 & 255), f(n & 255)]
    .map(v => v.toString(16).padStart(2, '0')).join('');
};
const UNDER  = BANDS.map((c, i) => BANDS[(i + BANDS.length - 1) % BANDS.length]);
const UN_OP  = 0.32;   /* f5m 的「垫色」：每条底下垫一层隔壁色，水彩的层次就是它 */

const K0 = 1.15, K1 = 2.72;      /* f5m 的洞径：比后来的版本小一圈 */
const WARM_PHI = -1.15, WARM_W = 1.05;  /* 暖区在上偏右（f5m 原样）*/
const LOBE_PHI = Math.PI * 0.845;
const LOBE_AMP = 0;      /* f5m 没有外缘的瓣 */
const STROKE = 3.5;        /* f5m 的细墨线：7px 在 168 条时糊成一片，6 刚好 */

const CFG = { N: 78, S: 0.98, T: 1.0, width: 1.05, longfrac: 0.30, seed: 7, SPEED: 0.42 };

/* ---------------- v9 真实感参数（全部绕开用户定标值） ---------------- */
const BCX = 1083, BCY = 913;      /* 本体球心（定标） */
const RING  = 372;                /* 光子环屏幕半径（600 本地 × 0.62114） */
const K_END = 1.02;               /* 坠落终点（k 单位，1.02×338≈345px，视界内） */
const ISCO  = 1.55;               /* 最内稳定轨道：以内俯冲坠落，以外收尾内倾 */
const PLFRAC = 0.25;              /* 行程最后 25% 为坠落段 */
const ROT = 0.03;                 /* v9-P5 整体公转（rad/s），整盘净角位移不再为零 */
const DOP_PHI = Math.PI;          /* v9-P4 多普勒增亮方位：左缘逼近（盘顺时针 +φ） */
/* v11：深空模式下把多普勒集束拉到接近真实的量级。
   白纸底上 ±14% 就够了（再大就开始花）；但暗底上「变暗」是直接露黑，
   观感强得多，而且真实的相对论集束是 3~10 倍亮度比 —— 没有这种极端
   明暗不对称，盘就读成「匀速转的装饰扇」，而不是「以半光速甩过来的物质」。
   仍是只调不透明度、不动色板，风格不变。 */
const SKY = !/paper/.test(location.search);   /* ?paper 回到白纸版 */
const DOP_AMP = SKY ? 0.38 : 0.14;
/* 坠落段红移压暗一档。暗底上不能压太狠：压到 0.55 的深色细带在星空上
   读成「划痕」而不是「暗掉的光」，所以深空模式只压到 0.74。 */
const DARKB = BANDS.map(c => darken(c, SKY ? 0.74 : 0.55));
/* v10 试过「吸积闪烁」（每条弧亮度乘一个双频正弦），结论是这条路在平涂上走不通：
   主盘 fade 多数已经到 1（不透明度上限），往上乘会被 SVG 夹掉 ——
   实测对称抖动只影响 0.96% 的像素；改单向（只压暗）也只有 0.69%，
   代价是整盘平均压暗 3%。要让满饱和的色块真的抖起来只能换填充色，
   那就破坏了「平涂一个色」这条风格前提。所以不做，参数和开关一并删掉。
   想复现的话：在 fade 上乘 1 - 0.04*(0.5+0.5sin) - 0.02*(0.5+0.5sin) 即可。 */
/* 调试隔离开关：?noplunge 关坠落/内倾，?nohalo 关弯折像，?noflow 关吸积流线，?paper 白纸版 */
const NOPL   = /noplunge/.test(location.search);
const NOHALO = /nohalo/.test(location.search);

/* ---------------- 随机 ---------------- */
const rng = seed => { let s = seed >>> 0; return () => {
  s = (s + 0x6D2B79F5) >>> 0; let t = s;
  t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61);
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
const R = rng(CFG.seed);
const gauss = (m, sd) => {
  let u = 0, v = 0;
  while (u === 0) u = R();
  while (v === 0) v = R();
  return m + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
};
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const pt = (k, phi) => {
  const x = A * k * Math.cos(phi), y = A * k * Math.sin(phi) * SIG;
  return [CX + x * CT - y * ST, CY + x * ST + y * CT];
};

/* ---------------- 选色带（原图实测占比 + 亮扇区加权） ---------------- */
function pickBand(phi, norm) {
  const w = WEIGHT.slice();
  let d = phi - WARM_PHI;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  const boost = Math.exp(-Math.pow(d / WARM_W, 2)) * (0.6 + 1.6 * norm);
  /* 只有暖色被扇区放大，紫、深紫不放大 —— 否则暖区一集中，整盘就跟着变色 */
  const MUL = [2.4, 2.6, 0.8, 0.5, 0];   /* 顺序跟 BANDS 对齐：黄 橙 鲑 粉 紫 */
  for (let i = 0; i < w.length; i++) w[i] *= 1 + MUL[i] * boost;
  const tot = w.reduce((a, b) => a + b, 0);
  let r = R() * tot;
  for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) return i; }
  return w.length - 1;
}

/* ---------------- 一条弧（带状多边形 · 水滴剖面） ---------------- */
/* f5m 的剖面：hw = bw/2 · sin(π·u^0.85)^0.45 —— 左右对称的梭形、两端圆头。
   这是「顺眼」的关键之一：之前的水滴剖面（长尾 + 钝头）在动起来之后
   会拉成一根根细长的逗号，f5m 那种胖梭形就没了。 */
const profile = u => Math.pow(Math.sin(Math.PI * Math.pow(u, 0.85)), 0.45);

function ribbonPath(k0, phi0, dphi, bw, n, sh, xf) {
  const kd = sh ? (sh.kd || 0) : 0;             // 沿弧的半径漂移：斜着切过去的带子
  const out = [], inn = [];
  for (let i = 0; i <= n; i++) {
    const u = i / n;
    const phi = phi0 + dphi * u;
    const kk = k0 + kd * u;
    const p = pt(kk, phi), q1 = pt(kk, phi + 0.02), q0 = pt(kk, phi - 0.02);
    const dx = q1[0] - q0[0], dy = q1[1] - q0[1];
    const L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L, ny = dx / L;
    const hw = bw * 0.5 * profile(u);
    out.push([p[0] + nx * hw, p[1] + ny * hw]);
    inn.push([p[0] - nx * hw, p[1] - ny * hw]);
  }
  /* v9-P1：可选点变换 —— 对整条带子的外/内轮廓逐点做透镜映射。
     带形在透镜下本来就该被扭曲/压缩，直接变换轮廓点是对的。 */
  if (xf) for (let i = 0; i <= n; i++) { out[i] = xf(out[i]); inn[i] = xf(inn[i]); }
  let d = 'M' + out[0][0].toFixed(1) + ' ' + out[0][1].toFixed(1);
  for (let i = 1; i <= n; i++) d += 'L' + out[i][0].toFixed(1) + ' ' + out[i][1].toFixed(1);
  for (let i = n; i >= 0; i--) d += 'L' + inn[i][0].toFixed(1) + ' ' + inn[i][1].toFixed(1);
  return d + 'Z';
}

/* ---------------- v9-P1 透镜映射（v10 扩成「多阶像」） ----------------
   点质量透镜方程 θ± = (β ± √(β²+4L²))/2 的风格化版。
   真实黑洞的阴影外缘不是一个光环，而是一串**高阶像**：光线绕黑洞 1 圈、
   2 圈、3 圈……才逃出来，每一阶都成一圈更细更淡的像，堆叠成贴边的亮带
   （Interstellar / EHT 那条边缘发光带就是这么来的）。
   所以这里用同一个映射、不同目标半径生成三层：一阶 398、二阶 424、三阶 452。
   lensLow 是远侧光的镜像副像 —— 从视界下方绕过来，形成下缘那条弧。 */
const lensBand = (r0, slope) => p => {
  const vx = p[0] - BCX, vy = p[1] - BCY;
  const d = Math.hypot(vx, vy) || 1;
  const w = clamp(1 - (d - RING) / 430, 0, 1);
  if (w <= 0) return p;
  const dT = r0 + (d - RING) * slope;
  const dd = d + w * (dT - d);
  return [BCX + vx * dd / d, BCY + vy * dd / d];
};
const lensUp  = lensBand(398, 0.20);   /* 一阶像：最亮，贴光子环 */
const lensLow = p => {
  const vx = p[0] - BCX, vy = p[1] - BCY;
  const d = Math.hypot(vx, vy) || 1;
  const w = clamp(1 - (d - 340) / 420, 0, 1);
  if (w <= 0) return p;
  const dd = d + w * (438 + (d - 340) * 0.12 - d);
  return [BCX - vx * dd / d, BCY - vy * dd / d];   /* 镜像 → 下缘副像 */
};
/* 透镜像专用平剖面（kd=0）。原弧带斜切，径向压扁后轮廓会自交，
   nonzero 填充在交叠区挖出白缝 —— 看起来像阴影边缘被撕成针状。 */
const SHFLAT = { kd: 0 };

/* ================= 缓动 =================
   全部走真正的三次贝塞尔求解，不用幂函数近似。

   曲线是选过的，不是抄的。技能库 improve-animations/AUDIT.md 里的两条 token
   是为 200~300ms 的 UI 元素准备的，直接搬到 1 秒的循环上会出问题 —— 实测峰值斜率：

     cubic-bezier(0.77, 0, 0.175, 1)   峰值 4.95   中间 20% 的时间走完 62% 的路
     cubic-bezier(0.65, 0, 0.35, 1)    峰值 2.86   走完 50%
     cubic-bezier(0.55, 0, 0.45, 1)    峰值 2.22   走完 42%   ← 主曲线
     cubic-bezier(0.42, 0, 0.58, 1)    峰值 1.70   走完 33%   ← 大块（= CSS ease-in-out）
     cubic-bezier(0.23, 1, 0.32, 1)    峰值 4.34   起步斜率 4.3（= strong ease-out）

   峰值 4.95 的曲线在 300ms 的抽屉上很利落，放到 1 秒的吸积盘上就是「抽鞭子」：
   停很久 → 一瞬间冲出去 → 又停住。所以循环里的位移降到 2.22 / 1.70 两档，
   4.34 那条只留给入场（出现应该起步快、尾巴长，这是它的正确用途）。

   位移只用 in-out 家族：两端导数严格为 0，所以「驻留 → 起步」「减速 → 停住」
   两处速度连续。ease-out 起步导数 4.3，一放开就窜，放进循环就是抖动源。
   ======================================== */
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X  = t => ((ax * t + bx) * t + cx) * t;
  const Y  = t => ((ay * t + by) * t + cy) * t;
  const dX = t => (3 * ax * t + 2 * bx) * t + cx;
  return x => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 6; i++) {                 /* Newton-Raphson 反解参数 t */
      const e = X(t) - x;
      if (Math.abs(e) < 1e-6) break;
      const d = dX(t);
      if (Math.abs(d) < 1e-6) break;
      t = Math.min(1, Math.max(0, t - e / d));
    }
    return Y(t);
  };
}
const EASE_FLOW      = bezier(0.55, 0, 0.45, 1);   /* 位移主曲线，峰值 2.22 */
const EASE_FLOW_SOFT = bezier(0.42, 0, 0.58, 1);   /* 大块/外侧，峰值 1.70（= CSS ease-in-out） */
const EASE_OUT       = bezier(0.23, 1, 0.32, 1);   /* 只给入场 */
/* v9-P2 坠落曲线：纯 ease-in。起步导数 = y1/x1 = 0 —— 驻留/主曲线末端速度
   连续，不窜；末端导数 = (1-y2)/(1-x2) = ∞ —— 加速冲进视界，在最快处消失。
   这是「被引力拽进去」的形状，与 ease-out（滑行减速停下）正好相反。 */
const EASE_PLUNGE    = bezier(0.55, 0, 1, 0.45);

/* 每条曲线的峰值斜率：把瞬时速度归一化到 0~1。
   没有这一步，换一条曲线拉伸幅度就跟着变；有了它，任何曲线下
   「最快的那一刻」都对应 v=1，形变强度才是可比的。 */
const PEAK = new Map();
function peakOf(f) {
  if (PEAK.has(f)) return PEAK.get(f);
  let m = 0;
  const n = 400;
  for (let i = 1; i <= n; i++) {
    const a = (i - 1) / n, b = i / n;
    m = Math.max(m, (f(b) - f(a)) * n);
  }
  PEAK.set(f, m || 1);
  return m || 1;
}

/* 两端驻留 + 中间按曲线推进（相当于 SMIL 的 keyTimes + keySplines） */
function travelEase(c, hold, f) {
  if (c <= hold) return 0;
  if (c >= 1 - hold) return 1;
  return f((c - hold) / (1 - 2 * hold));
}

const smoothstep = (a, b, x) => {
  const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};

/* ---------------- 生成：逐行对齐 frame.py 的 build() ----------------
   f5m 那一版的观感来自四件事，缺一样就不像了：
   1) 色板是浅紫 #B068D2，不是深紫；2) 描边只有 7px，细得刚刚好；
   3) 色带窄（26~41），所以条与条之间有意留白；4) 每条底下垫一层「隔壁色」。
   这一版把视觉参数全部按 f5m 复原；速度和节奏沿用后面那套统一模型。 */
const arcs = [];

/* 内缘亮环：贴着洞边绕一圈的几条浅黄，f5m 是 6 条 */
const RIM = 6;
for (let i = 0; i < RIM; i++) {
  const phi0 = i / RIM * 2 * Math.PI + R() * 0.4;
  arcs.push({
    k: 1.065 + R() * 0.045, phi0,
    d0: CFG.S * (1.0 + 0.6 * R()),
    bw: (14 + 5 * R()) * CFG.width,
    band: 0, op: 1.0, front: false, inner: true,
  });
}

/* 主盘：半径集中在 k≈1.75，尾部拖到 2.72；带宽随半径变粗（原样照搬 frame.py） */
for (let i = 0; i < CFG.N; i++) {
  const k = clamp(gauss(1.75, 0.40), K0, K1);
  const phi0 = R() * 2 * Math.PI;
  const norm = clamp((k - K0) / (K1 - K0), 0, 1);
  const long = R() < CFG.longfrac ? 1.6 : 1.0;
  let d0 = CFG.S * (0.7 + 0.55 * R()) * long * (1.1 - 0.2 * norm);
  const bw = (40 + 26 * Math.pow(norm, 0.7)) * CFG.width;
  const mid = phi0 + d0 / 2;
  d0 *= 1 + LOBE_AMP * Math.max(0, Math.cos(mid - LOBE_PHI));
  arcs.push({
    k, phi0, d0, bw,
    band: pickBand(mid, norm),
    op: 1,                      /* 填色不透明：半透明叠同色会压出等距暗纹 */
    front: false, inner: false, main: false,
  });
}

/* 近侧穿洞：k<1 的那两条横过内孔的紫带。
   白纸版里它们是「鼻子/笑弧」，是那张图的可爱感来源；
   深空版里它们就是硬伤 —— 视界以内不该有任何物质可见。
   用 op=0 关掉（不走 continue，R() 要照吃，否则后面整盘重排）。 */
for (let i = 0; i < 2; i++) {
  const phi0 = 0.35 + R() * 1.5;
  arcs.push({
    k: 0.72 + R() * 0.20, phi0,
    d0: CFG.S * (0.9 + 0.5 * R()) * 1.1,
    bw: (20 + 7 * R()) * CFG.width,
    band: 4, op: SKY ? 0 : 1, front: true, inner: false,
  });
}

/* ---------------- 运动参数：单向走一段，不整圈 ----------------
   速度必须「只由半径决定」。原来是 每条弧再各自随机 ±30%，结果整盘互相追尾：
   同一时刻有的在冲、有的在爬、有的停住，看上去乱 —— 这才是「不美观」的根子，
   不是缓动曲线的问题。现在只用一条连续的速度律（内快外慢），
   缓动也统一成一条，只有「行程长短」和「相位」还保留随机。
   drain() 是保留随机序列用的：下面几步原来各吃掉一个 R()，
   直接删掉会让之后的序列整体错位、全盘布局重排。 */
const mSolo = location.search.match(/[?&]solo=(\d+)/);
const SOLO = mSolo ? parseInt(mSolo[1], 10) : -1;
let aIdx = 0;
const drain = n => { for (let i = 0; i < n; i++) R(); };
for (const a of arcs) {
  a.solo = (aIdx++ === SOLO);
  a.birth = 0.04 + 0.92 * Math.pow(R(), 0.85);
  /* 行程收窄：跨度 0.9 弧度已经够「走一段」，原来最长的比最短的长 3 倍，
     同一帧里有的快要走完、有的刚起步，看着就乱。 */
  a.span = a.inner ? 0.55 + 0.60 * R() : 0.62 + 0.85 * R();
  /* 单一速度律：0.62 次幂是「开普勒盘压扁」的形状，内外比约 1.8:1，
     连续、没有档位，所以相邻两条永远只差一点点，追不上也落不下 */
  /* ±5% 的极小抖动：肉眼看不出来，但它让同半径的相邻弧在十几秒里慢慢错开，
     颜色不会永远冻在同一个位置（原来 ±30% 才是「乱」的来源） */
  a.w = CFG.SPEED * (1 + 0.10 * (R() - 0.5)) / Math.pow(a.k / 1.45, 0.62);
  a.ph = R() * 6.283;
  a.hold = 0.03 + 0.01 * R();                        /* 驻留统一到 3%~4% */
  drain(1);                                          /* 原来的二选一缓动 */
  a.ease = EASE_FLOW_SOFT;                           /* 全盘同一条曲线，节奏才统一 */
  a.peak = peakOf(a.ease);
  /* 斜穿：主笔斜得多（从内径切到外径），细笔只轻微偏一点 —— 原图的交叉斜带就是它 */
  /* 斜穿幅度压小：f5m 的带子基本沿椭圆车道走，drift 一大就变成「编篮子」 */
  a.kd  = 0.12 * (R() - 0.5) * 0.46;
  /* 漂移上限按带宽算：k 单位 1 ≈ 338 像素，漂移超过半个带宽两条侧边就会交叉，
     渲染出来是一个尖角（蝴蝶结）。±0.45bw 是看着最像「斜着切过去」的临界值。 */
  a.kd = clamp(a.kd, -0.45 * a.bw / A, 0.45 * a.bw / A);
  /* 剖面已经换回 f5m 的对称梭形，这几个形参不再参与造型，但 R() 照吃，
     否则随机序列错位、整盘重排 */
  drain(4);
  /* 原来 18% 的弧把相位量化到 9~13 档（「一拍一拍」地跳）。静止看着像定格动画，
     动起来就是同一画面里一半在走一半在跳 —— 全部去掉，但保留原来 1~2 次抽取。 */
  if (R() < 0.18) R();
}

/* 深度排序：按 sin(中点角) 从后往前叠 */
const depthKey = a => Math.sin(a.phi0 + a.d0 / 2);
arcs.sort((p, q) => depthKey(p) - depthKey(q));

/* ---------------- 建 DOM ---------------- */

/* ---------------- v9 新图层组 ----------------

if (SKY) {

  const skyDefs = document.createElementNS(NS, 'defs');
  skyDefs.innerHTML =

    '<radialGradient id="skyvig" cx="0.5" cy="0.5" r="0.74">' +
      '<stop offset="0.50" stop-color="#000000" stop-opacity="0"/>' +
      '<stop offset="1" stop-color="#000000" stop-opacity="0.62"/>' +
    '</radialGradient>';
  svg.appendChild(skyDefs);
  const bg = document.createElementNS(NS, 'rect');
  bg.setAttribute('x', 0); bg.setAttribute('y', 0);
  bg.setAttribute('width', 1920); bg.setAttribute('height', 1920);
  bg.setAttribute('fill', 'url(#skyg)');
  gSky.appendChild(bg);
  /* 暗角：把注意力压回中心，同时让四角真的黑下去 —— 这是「无限深」的错觉来源 */
  const vg = document.createElementNS(NS, 'rect');
  vg.setAttribute('x', 0); vg.setAttribute('y', 0);
  vg.setAttribute('width', 1920); vg.setAttribute('height', 1920);
  vg.setAttribute('fill', 'url(#skyvig)');
  gSky.appendChild(vg);
}

/* v9-P3 静态星场：位置生成时直接烘入透镜主像位移 θ+ = (d+√(d²+4L²))/2，
   L=180 —— 洞周 500px 内的星全部落入俘获锥被丢弃（净空），
   500~600 一带因位移堆积变密（爱因斯坦环的密度特征）。
   一次性计算，零每帧成本。
   v11：改用独立随机源 RS。原来吃 R()，改星数就会把后面碎屑的
   随机序列整体挪位、整盘重排 —— 星场和盘面必须解耦。 */
{
  const RS = rng(2213);
  const NST = SKY ? 900 : 70;
  /* v11 修一个 v9 留下的概念错误：原来 θE=180 且把 d<240 的星全部丢掉，
     而 d≈θE 那一圈**正是**强透镜区 —— 等于把唯一会弯的地方挖掉了，
     剩下的只是弱场平移（θ ≈ β + θE²/β），看不出任何形变。
     现在 θE=240，并且按「落到哪个半径」来决定画法：
     d 在 250~440 的星会被推到屏幕半径 400~560，也就是阴影外那圈，
     越靠近 θE 切向拉伸越狠 —— 那才是爱因斯坦环。 */
  const TE = 240;
  let n = 0, guard = 0;
  while (n < NST && guard++ < 200000) {
    /* 采样偏置：45% 的星直接撒在会成环的那一带，否则 1920² 的面积里
       落到环上的只有一成，环永远稀稀拉拉。 */
    let x, y;
    if (SKY && RS() < 0.45) {
      const rr = 250 + RS() * 270, ag = RS() * 2 * Math.PI;
      x = BCX + rr * Math.cos(ag); y = BCY + rr * Math.sin(ag);
    } else {
      x = 20 + RS() * 1880; y = 20 + RS() * 1880;
    }
    const vx = x - BCX, vy = y - BCY;
    const d = Math.hypot(vx, vy) || 1;
    if (d < 246 || d > 1600) continue;
    const dp = 0.5 * (d + Math.sqrt(d * d + 4 * TE * TE));
    const px = BCX + vx * dp / d, py = BCY + vy * dp / d;
    if (!SKY) {
      const st = document.createElementNS(NS, 'circle');
      st.setAttribute('cx', px.toFixed(1));
      st.setAttribute('cy', py.toFixed(1));
      st.setAttribute('r', (1.2 + RS() * 1.4).toFixed(2));
      st.setAttribute('fill', RS() < 0.12 ? '#F4789B' : '#4B4560');
      st.setAttribute('opacity', (0.16 + RS() * 0.22).toFixed(3));
      gStars.appendChild(st);
      n++; continue;
    }
    /* 切向拉伸强度：按**源**半径算，越接近 θE 拉得越长。
       这是透镜的真相 —— 同一个点光源在临界曲线附近被抹成一条长弧。 */
    const t = clamp(1 - (d - 250) / 190, 0, 1);
    const rr = 1.0 + RS() * 2.1;
    if (t > 0.03) {
      const span = 0.008 + 0.115 * t * t;
      const ang = Math.atan2(py - BCY, px - BCX);
      const a0 = ang - span / 2, a1 = ang + span / 2;
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', 'M' + (BCX + Math.cos(a0) * dp).toFixed(1) + ' ' + (BCY + Math.sin(a0) * dp).toFixed(1) +
        'A' + dp.toFixed(1) + ' ' + dp.toFixed(1) + ' 0 0 1 ' +
        (BCX + Math.cos(a1) * dp).toFixed(1) + ' ' + (BCY + Math.sin(a1) * dp).toFixed(1));
      p.setAttribute('fill', 'none');
      p.setAttribute('stroke', RS() < 0.24 ? '#FFD9A8' : '#E6EEFF');
      p.setAttribute('stroke-width', (rr * 1.7).toFixed(2));
      p.setAttribute('stroke-linecap', 'round');
      p.setAttribute('opacity', (0.26 + 0.60 * t).toFixed(3));
      gStars.appendChild(p);
    } else {
      const st = document.createElementNS(NS, 'circle');
      st.setAttribute('cx', px.toFixed(1));
      st.setAttribute('cy', py.toFixed(1));
      st.setAttribute('r', rr.toFixed(2));
      const q = RS();
      st.setAttribute('fill', q < 0.16 ? '#FFD9A8' : (q < 0.46 ? '#CFDCFF' : '#FFFFFF'));
      st.setAttribute('opacity', (0.22 + RS() * 0.68).toFixed(3));
      gStars.appendChild(st);
    }
    n++;
  }
}

/* v11 极向喷流：黑洞最省力的「身份证」。沿自转轴双向甩出的相对论性物质，
   画成两条渐宽渐淡的锥。轴向取盘主轴的垂线（-20°+90°），再按观察倾角
   做 0.60 的垂直压缩 —— 否则两条锥会直挺挺地立着，不像斜看。
   平涂风格下用 10 段等分色阶拼出「渐淡」，不用 gradient。 */
const gJet = document.createElementNS(NS, 'g');
if (SKY) {
  gJet.setAttribute('transform',
    'translate(' + BCX + ' ' + BCY + ') scale(1 0.60) rotate(70)');
  const JL = 1000, SEG = 10;
  for (const dir of [1, -1]) {
    for (let i = 0; i < SEG; i++) {
      const x1 = dir * JL * i / SEG, x2 = dir * JL * (i + 1) / SEG;
      const u1 = i / SEG, u2 = (i + 1) / SEG;
      const w1 = 26 + 170 * Math.pow(u1, 0.75), w2 = 26 + 170 * Math.pow(u2, 0.75);
      const q = document.createElementNS(NS, 'path');
      q.setAttribute('d', 'M' + x1.toFixed(1) + ' ' + (-w1).toFixed(1) +
        'L' + x2.toFixed(1) + ' ' + (-w2).toFixed(1) +
        'L' + x2.toFixed(1) + ' ' + w2.toFixed(1) +
        'L' + x1.toFixed(1) + ' ' + w1.toFixed(1) + 'Z');
      q.setAttribute('fill', i < 3 ? '#D5E4FF' : '#A8C4FF');
      q.setAttribute('opacity', (0.20 * Math.pow(1 - u1, 1.5) + 0.012).toFixed(3));
      gJet.appendChild(q);
    }
    /* 轴心亮核：一条很细的高亮，让锥有「束」的感觉而不是一块淡色三角 */
    for (let i = 0; i < 6; i++) {
      const x1 = dir * JL * i / 6, x2 = dir * JL * (i + 1) / 6;
      const u1 = i / 6;
      const w = 4 + 7 * u1;
      const q = document.createElementNS(NS, 'path');
      q.setAttribute('d', 'M' + x1.toFixed(1) + ' ' + (-w).toFixed(1) +
        'L' + x2.toFixed(1) + ' ' + (-(w + 1.5)).toFixed(1) +
        'L' + x2.toFixed(1) + ' ' + (w + 1.5).toFixed(1) +
        'L' + x1.toFixed(1) + ' ' + w.toFixed(1) + 'Z');
      q.setAttribute('fill', '#F2F7FF');
      q.setAttribute('opacity', (0.30 * Math.pow(1 - u1, 1.8) + 0.015).toFixed(3));
      gJet.appendChild(q);
    }
  }
}

/* v9-P0 光子环：画在视界「内侧」的一圈亮边（不 blur）。
   真实 EHT 照片里亮环就贴着阴影边界的内侧 —— 画在外面会被同半径的
   内缘黄弧覆盖（v8 的盘内缘就在球缘上，没有空隙），画在里面才读得出来：
   暗球 + 一圈发光边缘 = 光被引力俘获。
   v10 增补：环上一串短亮弧（热点）沿环滑行 + 整体亮度慢脉动 ——
   被俘获的光在光子球上打转，是「黑洞活着」最省成本的信号。 */
const gRing = document.createElementNS(NS, 'ellipse');
gRing.setAttribute('cx', BCX); gRing.setAttribute('cy', BCY);
gRing.setAttribute('rx', 360); gRing.setAttribute('ry', 360 * SQ);
gRing.setAttribute('fill', 'none'); gRing.setAttribute('stroke', '#FEEB99');
gRing.setAttribute('stroke-width', 7); gRing.setAttribute('opacity', 0.78);
gPhoton.appendChild(gRing);

const gRingInner = document.createElementNS(NS, 'ellipse');
gRingInner.setAttribute('cx', BCX); gRingInner.setAttribute('cy', BCY);
gRingInner.setAttribute('rx', 337); gRingInner.setAttribute('ry', 337 * SQ);
gRingInner.setAttribute('fill', 'none'); gRingInner.setAttribute('stroke', '#FCA346');
gRingInner.setAttribute('stroke-width', 3); gRingInner.setAttribute('opacity', 0.35);
gPhoton.appendChild(gRingInner);

/* v10 高阶像堆叠：真实光线绕黑洞 2 圈、3 圈……才逃出来，高阶像会
   **渐近地挤向临界曲线**，越高的阶越细越暗。所以这里不是往外画，而是
   贴着光子环再往内收两层（330 / 318）—— 阴影内部是纯黑底，
   这几道细环才读得出来；画在盘面上会被同色弧淹没。 */
const gRing3 = document.createElementNS(NS, 'ellipse');
gRing3.setAttribute('cx', BCX); gRing3.setAttribute('cy', BCY);
gRing3.setAttribute('rx', 330); gRing3.setAttribute('ry', 330 * SQ);
gRing3.setAttribute('fill', 'none'); gRing3.setAttribute('stroke', '#F6B45E');
gRing3.setAttribute('stroke-width', 2); gRing3.setAttribute('opacity', 0.13);
gPhoton.appendChild(gRing3);

const gRing4 = document.createElementNS(NS, 'ellipse');
gRing4.setAttribute('cx', BCX); gRing4.setAttribute('cy', BCY);
gRing4.setAttribute('rx', 318); gRing4.setAttribute('ry', 318 * SQ);
gRing4.setAttribute('fill', 'none'); gRing4.setAttribute('stroke', '#E9A254');
gRing4.setAttribute('stroke-width', 1.4); gRing4.setAttribute('opacity', 0.07);
gPhoton.appendChild(gRing4);

/* 热点：用 stroke-dasharray 在环上切出一串短亮弧，再靠 dashoffset 让它们沿环滑行。
   节拍必须按「椭圆周长」精确等分 —— 椭圆不是圆，2π·rx 会算多 4%，
   等分不准就会留下一个明显偏大的豁口（一眼看出是贴图接缝）。
   Ramanujan 近似足够准（误差 <0.02%）。 */
const ellipseC = (rx, ry) => {
  const h = Math.pow((rx - ry) / (rx + ry), 2);
  return Math.PI * (rx + ry) * (1 + 3 * h / (10 + Math.sqrt(4 - 3 * h)));
};
const beadPeriod = (rx, n) => ellipseC(rx, rx * SQ) / n;

/* 热点必须画在「亮边上」而不是阴影内部 —— 热斑是吸积流里的亮区，
   本来就该压在光子环的亮线上扫过去；画在黑底中央会读成一道划痕。
   但内缘黄弧（360~375）铺在 gPhoton 之上，会把热点盖住，
   所以热点单独成层 gBeadL，插在 gFront 之后（压在近侧盘之上）。
   这一层最便宜的做法就是让 dash 本身就是亮边的高光。 */
const gBeadL = document.createElementNS(NS, 'g');

/* 主组：3 处热点，跟着盘一起绕（速度快，最亮）。
   半径压在「黑 / 亮边」的交界上（357，黑球半宽 370、亮边在 360~375）：
   再往外 368 就整条落在奶油色亮边上，白压白看不出明暗；
   再往里 350 则是纯黑底上一条灰弧，读成划痕。只有骑在交界上才会
   沿环读出「一段亮一段暗」—— 热斑扫过光子环就是这个观感。 */
const BEAD_R1 = 357, BEAD_N1 = 3, BEAD_P1 = beadPeriod(BEAD_R1, BEAD_N1);
const gBeads = document.createElementNS(NS, 'ellipse');
gBeads.setAttribute('cx', BCX); gBeads.setAttribute('cy', BCY);
gBeads.setAttribute('rx', BEAD_R1); gBeads.setAttribute('ry', BEAD_R1 * SQ);
gBeads.setAttribute('fill', 'none'); gBeads.setAttribute('stroke', '#FFFBEA');
gBeads.setAttribute('stroke-width', 10); gBeads.setAttribute('opacity', 0.55);
gBeads.setAttribute('stroke-dasharray',
  (BEAD_P1 * 0.09).toFixed(1) + ' ' + (BEAD_P1 * 0.91).toFixed(1));
gBeadL.appendChild(gBeads);

/* 副组：5 处更细的热点，略靠外、慢一档 —— 两组不同步，环上就不会「整圈一起闪」 */
const BEAD_R2 = 363, BEAD_N2 = 5, BEAD_P2 = beadPeriod(BEAD_R2, BEAD_N2);
const gBeads2 = document.createElementNS(NS, 'ellipse');
gBeads2.setAttribute('cx', BCX); gBeads2.setAttribute('cy', BCY);
gBeads2.setAttribute('rx', BEAD_R2); gBeads2.setAttribute('ry', BEAD_R2 * SQ);
gBeads2.setAttribute('fill', 'none'); gBeads2.setAttribute('stroke', '#FFE9B0');
gBeads2.setAttribute('stroke-width', 6); gBeads2.setAttribute('opacity', 0.30);
gBeads2.setAttribute('stroke-dasharray',
  (BEAD_P2 * 0.06).toFixed(1) + ' ' + (BEAD_P2 * 0.94).toFixed(1));
gBeadL.appendChild(gBeads2);

/* ---------------- v12 吸积流线 ----------------
   「吸入感」缺的不是速度，是**路径**。86 条弧各自走一段就消失，眼睛找不到
   一条从外面连进洞里的线，所以只读得出「转」，读不出「吸」。
   这里补 22 条对数螺旋：起点在盘外缘（k≈2.5），终点压在视界（k=1.10），
   1 圈左右的绕入量。用 dasharray 把它切成一段段的「物质块」，
   再让 dashoffset 沿路径往里走 —— 一块一块被拽进洞里，方向一目了然。
   放在 gBeadL 之下、gFront 之上：压过整个盘面（近侧也要能看见），
   但不会被任何弧盖住；终点正好落在亮边上，读作「进洞了」。
   独立随机源，不动 R()，盘面布局一字不变。 */
const NOFLOW = /noflow/.test(location.search);
const gFlow = document.createElementNS(NS, 'g');
const flows = [];
if (!NOFLOW) {
  const RF = rng(7717);
  const FN = 22, K_END_F = 1.10;
  for (let i = 0; i < FN; i++) {
    const phi0 = i / FN * 2 * Math.PI + RF() * 0.28;
    /* 纸感版起点收紧：纸上一旦出去就是白底上的几根孤线，像划痕 */
    const kOut = SKY ? 2.05 + RF() * 0.45 : 1.82 + RF() * 0.30;
    const turns = 0.70 + RF() * 0.60;          /* 绕入圈数：0.7~1.3 圈 */
    const lam = Math.log(kOut / K_END_F);      /* 保证终点正好落在 kEnd */
    const segs = 54;
    let d = '';
    for (let j = 0; j <= segs; j++) {
      const u = j / segs;
      const kk = kOut * Math.exp(-lam * u);
      /* u^0.8：外层松、内层紧 —— 同样的绕转角在内圈吃掉更少半径，
         螺旋自然收紧，观感上就是「越靠近越快」 */
      const ph = phi0 + 2 * Math.PI * turns * Math.pow(u, 0.80);
      const p = pt(kk, ph);
      d += (j ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1);
    }
    /* 颜色按介质走：深空版用发光色（浅），纸感版必须反过来 ——
       奶油色压在白纸上等于没画，得用深琥珀/赭色像铅笔线。 */
    const q0 = RF();
    const col = SKY
      ? (q0 < 0.3 ? '#FFF3CC' : (q0 < 0.6 ? '#FFD98E' : '#FFB877'))
      : (q0 < 0.34 ? '#E4805F' : (q0 < 0.7 ? '#D9704B' : '#F0A184'));
    const w0  = 4.5 + RF() * 5.5;
    /* 一条流线两层：底下一根**极淡的连续线**负责「勾出路径」，
       上面一段移动的**亮块**负责「看出流动」。
       一开始只画虚线段，结果是盘外飘着一堆没头没尾的短杠 ——
       眼睛连不成线，反而更乱。 */
    const base = document.createElementNS(NS, 'path');
    base.setAttribute('d', d);
    base.setAttribute('fill', 'none');
    base.setAttribute('stroke', col);
    base.setAttribute('stroke-width', (w0 * 0.66).toFixed(1));
    base.setAttribute('stroke-linecap', 'round');
    base.setAttribute('opacity', (SKY ? 0.16 : 0.24).toFixed(3));
    gFlow.appendChild(base);

    const el = document.createElementNS(NS, 'path');
    el.setAttribute('d', d);
    el.setAttribute('fill', 'none');
    el.setAttribute('stroke', col);
    el.setAttribute('stroke-width', w0.toFixed(1));
    el.setAttribute('stroke-linecap', 'round');
    el.setAttribute('stroke-dasharray',
      (170 + RF() * 130).toFixed(1) + ' ' + (150 + RF() * 210).toFixed(1));
    el.setAttribute('opacity', (SKY ? 0.48 : 0.46).toFixed(3));
    gFlow.appendChild(el);
    flows.push({ el, v: (150 + RF() * 110) * (1 + (kOut - 2.05) * 0.4), ph: RF() * 4000 });
  }
}

svg.append(gSky, gStars, gJet, gOrbit, hole, gBackU, gBack, gDebBack, gBodyIn,
           gHalo, gPhoton, gFrontU, gFront, gFlow, gBeadL, gDebFront, gHaloLow, gStream);

/* ---------------- 纸质颗粒 ----------------
   平涂色块之间全是硬边，放大看就像矢量填色软件直接导出的。
   叠一层极淡的噪点（multiply ≈ 4%）能把这层「数码感」压下去。
   噪点用 <canvas> 现做一张 256 的贴图当 pattern：白噪声平铺天然无缝，
   比 feTurbulence 便宜得多，而且不参与重绘 —— 滤镜方案每帧重算会吃掉帧率。 */
if (!location.search.includes('nograin')) {
  const cnv = document.createElement('canvas');
  cnv.width = cnv.height = 256;
  const ctx2 = cnv.getContext('2d');
  const img = ctx2.createImageData(256, 256);
  for (let i = 0; i < img.data.length; i += 4) {
    img.data[i] = img.data[i + 1] = img.data[i + 2] = 70;
    img.data[i + 3] = Math.random() * 30;
  }
  ctx2.putImageData(img, 0, 0);

  const defs = document.createElementNS(NS, 'defs');
  const pat = document.createElementNS(NS, 'pattern');
  pat.setAttribute('id', 'grainP');
  pat.setAttribute('width', 256); pat.setAttribute('height', 256);
  pat.setAttribute('patternUnits', 'userSpaceOnUse');
  const pim = document.createElementNS(NS, 'image');
  pim.setAttribute('href', cnv.toDataURL('image/png'));
  pim.setAttribute('width', 256); pim.setAttribute('height', 256);
  pat.appendChild(pim); defs.appendChild(pat); svg.appendChild(defs);

  const grain = document.createElementNS(NS, 'rect');
  grain.setAttribute('width', 1920); grain.setAttribute('height', 1920);
  grain.setAttribute('fill', 'url(#grainP)');
  grain.style.mixBlendMode = 'multiply';
  grain.style.pointerEvents = 'none';
  svg.appendChild(grain);
}

for (const k of [1.5, 2.0, 2.5]) {
  const e = document.createElementNS(NS, 'ellipse');
  e.setAttribute('cx', CX); e.setAttribute('cy', CY);
  e.setAttribute('rx', A * k); e.setAttribute('ry', A * k * SIG);
  e.setAttribute('fill', 'none'); e.setAttribute('stroke', '#5B45C4');
  e.setAttribute('stroke-width', 6); e.setAttribute('opacity', 0.3);
  e.setAttribute('stroke-dasharray', '18 22');
  e.setAttribute('transform', 'rotate(-20 ' + CX + ' ' + CY + ')');
  gOrbit.appendChild(e);
}
gOrbit.style.display = 'none';

for (const a of arcs) {
  /* 厚边（T 层）：偏内、更宽、暗一档，压在最底下 */
  const un = document.createElementNS(NS, 'path');
  un.setAttribute('fill', UNDER[a.band]);
  un.setAttribute('opacity', UN_OP * CFG.T);
  (isFrontArc(a) ? gFrontU : gBackU).appendChild(un);
  a.un = un;

  /* 填色层。墨线不再单独铺一层压在底下（那样只有最外圈露得出来），
     而是挂在同一条路径上 + paint-order="stroke fill"：
     描边画在自己填色的下面、却压在「之前画过的」填色上面 ——
     等于每一条都是一张带黑边的剪纸，叠起来就是原图那种分层轮廓。
     stroke-width 默认 0，由「墨线」开关打开；开着时细笔不描，只给宽笔描，
     不然 151 条细边全挤在一起又回到毛边。 */
  gBodyDoms(a);
}

/* 中线（不带宽度）。透镜像用「描边」画，不用「填充」：
   带形被径向压扁后内/外轮廓会自交，nonzero 填充在交叠处挖洞，
   洞后面正好是黑球 → 阴影边缘出现暗色划痕（实测在 3 点钟最明显）。
   描边只有一条中线，永远不会自交，粗细还直接等于视觉带宽。 */
function centerline(k0, phi0, dphi, n, sh, xf) {
  const kd = sh ? (sh.kd || 0) : 0;
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const p = pt(k0 + kd * (i / n), phi0 + dphi * (i / n));
    pts.push(xf ? xf(p) : p);
  }
  let d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
  for (let i = 1; i <= n; i++) d += 'L' + pts[i][0].toFixed(1) + ' ' + pts[i][1].toFixed(1);
  return d;
}

/* ---------------- v9-P1 透镜弯折像的 DOM ----------------
   候选 = 主盘最宽的 12 条 + 全部内缘亮环（它们最亮、最贴洞，弯过去最像）。
   每帧按「当前是否远侧」开门：弧的行程会把它们带进带出远侧半场，
   弯折像随之出现/消失 —— 这本身就是透镜的物理条件（只有远侧的光被折上来）。
   一阶 / 二阶 / 三阶按 bw 比例给粗细，越高的阶越细越淡。 */
const hCand = arcs.filter(x => !x.front).sort((x, y) => y.bw - x.bw);
const mkLens = (parent, a, wMul) => {
  const h = document.createElementNS(NS, 'path');
  h.setAttribute('fill', 'none');
  h.setAttribute('stroke', BANDS[a.band]);
  h.setAttribute('stroke-width', Math.max(2, a.bw * wMul).toFixed(1));
  h.setAttribute('stroke-linecap', 'round');
  h.setAttribute('stroke-linejoin', 'round');
  h.setAttribute('opacity', 0);
  parent.appendChild(h);
  return h;
};
for (let i = 0; i < hCand.length; i++) {
  const a = hCand[i];
  if (NOHALO) break;
  if (i >= 12 && !a.inner) continue;
  a.h1 = mkLens(gHalo, a, SKY ? 0.92 : 0.55);   /* 一阶像：深空模式加粗，把盘和阴影连起来 */
  if (a.inner) {
    a.h2 = mkLens(gHaloLow, a, SKY ? 0.80 : 0.48); /* 下缘镜像副像 */
  }
}

/* ---------------- v9-P3 环境碎片 ----------------
   26 颗小碎屑在盘面内沿对数螺旋坠入：r(θ) = r0·e^(−0.26·Δθ)。
   生命参数二次缓入（越掉越快），到 k<1.07（视界）被吞 → 外缘重生。
   前后景深按 sin(θ) 实时归组（穿过远侧时让路给本体）。 */
const DEBN = 32;
const DEBC = ['#8A8699', '#5B45C4', '#FCA346', '#B068D2', '#F4789B'];
const debris = [];
function newDeb(first) {
  const el = document.createElementNS(NS, 'ellipse');
  el.setAttribute('ry', (2.4 + R() * 1.6).toFixed(2));
  el.setAttribute('rx', 7);
  el.setAttribute('fill', DEBC[(R() * DEBC.length) | 0]);
  const o = 0.32 + R() * 0.3;
  el.setAttribute('opacity', 0);
  (R() < 0.5 ? gDebBack : gDebFront).appendChild(el);
  return { el, o, back: null,
    r0: 980 + R() * 480, th0: R() * 6.283,
    dth: 5.0 + R() * 1.1, T: 16 + R() * 14,
    t: first ? R() * 14 : 0 };
}
for (let i = 0; i < DEBN; i++) debris.push(newDeb(true));

function updDebris(dts) {
  for (const db of debris) {
    db.t += dts;
    const s = Math.min(1, db.t / db.T);
    const se = s * s;                                  /* ease-in 坠落加速 */
    const th = db.th0 + db.dth * se;
    const k = (db.r0 * Math.exp(-0.26 * db.dth * se)) / A;
    if (k < 1.07) {                                    /* 被吞 → 外缘重生 */
      db.el.setAttribute('opacity', 0);
      db.t = 0; db.th0 = R() * 6.283; db.r0 = 980 + R() * 480;
      continue;
    }
    const p = pt(k, th), p2 = pt(k, th + 0.02);
    const ang = Math.atan2(p2[1] - p[1], p2[0] - p[0]) * 180 / Math.PI;
    const spd = Math.hypot(p2[0] - p[0], p2[1] - p[1]) / 0.02;   /* px/rad */
    const st = 1 + Math.min(2.4, spd * se * 0.0045);   /* 越快越拉长 */
    db.el.setAttribute('rx', (7 * st).toFixed(1));
    db.el.setAttribute('transform',
      'translate(' + p[0].toFixed(1) + ' ' + p[1].toFixed(1) + ') rotate(' + ang.toFixed(1) + ')');
    const fadeK = clamp((k - 1.07) / 0.2, 0, 1);       /* 贴近视界渐隐 */
    db.el.setAttribute('opacity', (db.o * Math.min(1, s * 18) * fadeK).toFixed(3));
    const back = Math.sin(th) < 0;
    if (back !== db.back) { db.back = back; (back ? gDebBack : gDebFront).appendChild(db.el); }
  }
}

/* ---------------- v9-P3 潮汐流事件 ----------------
   每 15~25s 一条长带从外缘被拽入：头端沿开普勒式加速 dive 到视界，
   尾端仍挂在外盘 —— 一次完整的「撕碎 - 拉伸 - 吞没」叙事。 */
const streamEl = document.createElementNS(NS, 'path');
streamEl.setAttribute('fill', '#FCA346');
streamEl.setAttribute('stroke', 'none');
streamEl.setAttribute('opacity', 0);
gStream.appendChild(streamEl);
const STR = { on: false, t: 0, dur: 7.5, gap: 5 + R() * 8, phi0: 0, kO: 2.82 };
function updStream(dts) {
  if (RM) return;
  if (!STR.on) {
    STR.gap -= dts;
    if (STR.gap <= 0) { STR.on = true; STR.t = 0; STR.phi0 = R() * 6.283; }
    return;
  }
  STR.t += dts;
  const e = Math.pow(Math.min(1, STR.t / STR.dur), 2);   /* ease-in：越掉越快 */
  const kHead = STR.kO - (STR.kO - 1.06) * e;
  const kd = kHead - STR.kO;                             /* 头在内(u=1)、尾挂外缘 */
  const dphi = 1.9 + 0.6 * e;
  streamEl.setAttribute('d', ribbonPath(STR.kO, STR.phi0 + 4.4 * e, dphi,
                                        26 * (1 - 0.45 * e), 18, { kd }));
  const fadeH = kHead > 1.14 ? 1 : Math.max(0, (kHead - 1.04) / 0.10);
  streamEl.setAttribute('opacity', (0.5 * smoothstep(0, 0.06, e) * fadeH).toFixed(3));
  if (STR.t >= STR.dur) {
    STR.on = false; STR.gap = 15 + R() * 12;
    streamEl.setAttribute('opacity', 0);
  }
}
updDebris(0);   /* 首帧落位：碎片在入场/定格截图里也有位置，不会从原点弹入 */

/* 弧的填色层挂到对应的前/后组 */
function gBodyDoms(a) {
  const bd = document.createElementNS(NS, 'path');
  bd.setAttribute('fill', BANDS[a.band]);
  bd.setAttribute('stroke-linejoin', 'round');
  bd.setAttribute('stroke-linecap', 'round');
  bd.setAttribute('stroke', INK);
  bd.setAttribute('stroke-width', 0);
  a.iw = STROKE;               /* f5m：细线定宽 7，不随带宽变 */

  (isFrontArc(a) ? gFront : gBack).appendChild(bd);
  a.bd = bd;
}

/* ---------------- 绘制 ---------------- */
function drawArc(a, S) {
  const dphi = a.d0 * (0.30 + 0.70 * S);      /* 入场时别缩成小点 */
  const d = ribbonPath(a.k, a.phi0, dphi, a.bw, 15, shOf(a));
  a.bd.setAttribute('d', d);
  if (UN_OP > 0.01 && CFG.T > 0.01 && !a.front) {
    a.un.setAttribute('d', ribbonPath(a.k * 0.96, a.phi0, dphi * 1.03, a.bw * 1.25, 12, shOf(a)));
    a.un.setAttribute('opacity', UN_OP * CFG.T * S);
  } else {
    a.un.setAttribute('d', 'M0 0Z');
  }
}

/* 每条弧的形变参数：稳态与入场共用同一个函数，避免两处走样 */
const shOf = (a) => ({ kd: a.kd });

/* 稳态：沿环单向推进，走满 span 回起点 */
let clock = 0, flow = 0, moving = false, orderTick = 0;
const DC = 0.004;          /* 求瞬时速度用的相位步长 */

/* v10 光子环动画：整体慢脉动 + 两串热点沿环滑行。
   驱动写在 renderFlow 末尾统一调用，这样 ?t= 定格截图也能拿到确定的一帧
   （不依赖 ticker 累积了多少帧，验证时可复现）。 */
const BEAD_V1 = 46, BEAD_V2 = 27;   /* px/s 沿环滑行速度；副组慢一档，两组不同步 */
/* v12 流线驱动：沿路径方向（外→内）推进 dash，就是物质一块块被拽进去。
   负的 dashoffset = 图案朝路径终点移动；终点在视界上，方向天然正确。 */
function updFlow() {
  if (NOFLOW || RM) return;
  for (const f of flows) {
    f.el.setAttribute('stroke-dashoffset', (-(f.ph + clock * f.v)).toFixed(1));
  }
}

function updRing() {
  const ph = clock;
  const pulse  = 0.5 + 0.5 * Math.sin(ph * 0.83);
  const pulse2 = 0.5 + 0.5 * Math.sin(ph * 1.37 + 1.9);
  gRing.setAttribute('opacity', ((SKY ? 0.86 : 0.68) + 0.14 * pulse).toFixed(3));
  gRingInner.setAttribute('opacity', (0.30 + 0.12 * pulse2).toFixed(3));
  gRing3.setAttribute('opacity', (0.10 + 0.06 * pulse).toFixed(3));
  gRing4.setAttribute('opacity', (0.05 + 0.04 * pulse2).toFixed(3));
  gBeads.setAttribute('opacity', (0.34 + 0.28 * pulse2).toFixed(3));
  gBeads2.setAttribute('opacity', (0.16 + 0.20 * pulse).toFixed(3));
  if (!RM) {   /* 减少动效时热点停在原地，只保留亮度呼吸 */
    gBeads.setAttribute('stroke-dashoffset', (-(ph * BEAD_V1) % BEAD_P1).toFixed(1));
    gBeads2.setAttribute('stroke-dashoffset', (-(ph * BEAD_V2) % BEAD_P2).toFixed(1));
  }
}

function renderFlow() {
  /* v9-P5 径向呼吸：内缘 ±0.9%、按 1/k 向外衰减（替代 v8 的整组均匀缩放，
     那种呼吸内外同幅，读作「整体缩放」而不是「盘在搏动」）。减少动效时归零。 */
  const brA = RM ? 0 : 0.009;
  const brPh = Math.sin(clock * 0.52);
  for (const a of arcs) {
    const t = flow;
    const raw = (t * a.w + a.ph) / a.span;
    const cyc = raw - Math.floor(raw);

    /* 缓动推进：起步停一下 → 加速 → 减速 → 到点再停一下 */
    const p  = travelEase(cyc, a.hold, a.ease);
    const p2 = travelEase(cyc + DC, a.hold, a.ease);
    const v  = Math.min(1, Math.abs(p2 - p) / DC / a.peak);  // 归一化瞬时速度 0~1

    let k = a.k * (1 + (brA / Math.max(a.k, 1)) * brPh);

    /* v9-P2 坠落段：ISCO(1.55) 以内的弧在行程末 25% 切入纯 ease-in 俯冲，
       半径收敛到视界、潮汐拉伸变长变细；ISCO 以外只做收尾内倾（kd 负偏），
       给全盘一个「向内的物质流」方向，不越车道、不穿盘。 */
    let dphiMul = 1, bwMul = 1, plunging = false, pe = 0, lean = 0;
    if (!NOPL && a.k > 1.12 && a.k <= ISCO && cyc > 1 - PLFRAC) {
      plunging = true;
      pe = EASE_PLUNGE((cyc - (1 - PLFRAC)) / PLFRAC);
      k -= (k - K_END) * pe;
      dphiMul = 1 + 0.62 * pe;    /* v12：沿运动方向拉长 —— 潮汐拉伸 */
      bwMul   = 1 - 0.40 * pe;    /* v12：同时变细 —— 丝状化。
                                     拉到 2×/0.48× 会变成黑色细针：压暗后的填充
                                     在暗底上几乎等于背景色，细长一条就成了划痕。 */
    } else if (!NOPL && a.k > ISCO && cyc > 0.86) {
      const le = (cyc - 0.86) / 0.14;
      lean = -Math.min(0.10, (a.k - 1.35) * 0.09) * le;
      dphiMul = 1 + 0.16 * le;
      bwMul   = 1 - 0.08 * le;
    }
    /* v9-P5 整体公转 + 坠落时的开普勒联动追加扫角（越近转越快） */
    a.phi0 = a.home + a.span * p + ROT * t
           + (plunging ? 0.42 * Math.pow(a.w / CFG.SPEED, 1.5) * pe : 0);

    /* 水滴的一生：驻留时长成整条 → 跑起来拉长变细 → 到点减速停住。
       坠落时改判：保持实体到行程末 3%，在光子环处断掉 —— 被吞，不是溶。 */
    const rIn  = Math.max(0.020, a.hold * 0.50);   /* 出生：在驻留期内长完 */
    const rOut = Math.max(0.035, a.hold * 1.50);
    let env  = Math.min(smoothstep(0, rIn, cyc), smoothstep(0, rOut, 1 - cyc));
    if (plunging) env = Math.min(env, smoothstep(0.012, 0.028, 1 - cyc));

    const dphi = a.d0 * (0.55 + 0.45 * env) * (1 + 0.22 * v) * dphiMul;
    const bw   = a.bw * (0.70 + 0.30 * env) * (1 - 0.05 * v) * bwMul;
    const sh   = { kd: a.kd + lean };

    /* v9-P4 多普勒集束：逼近侧（左）增亮、远离侧压暗，只调不透明度 */
    const phiMid = a.phi0 + dphi * 0.5;
    const dop = 1 + DOP_AMP * Math.cos(phiMid - DOP_PHI);

    /* v9-P2 吞没判定：屏幕距离进入光子环内侧（或 k 到底）即消失 */
    let swallow = 0;
    if (plunging) {
      const pm = pt(k, phiMid);
      if (Math.hypot(pm[0] - BCX, pm[1] - BCY) < 384 || k <= K_END + 0.004) swallow = 1;
    }

    const d = ribbonPath(k, a.phi0, dphi, bw, 15, sh);
    a.bd.setAttribute('d', d);
    if (UN_OP > 0.01 && CFG.T > 0.01 && !a.front) {
      a.un.setAttribute('d',
        ribbonPath(k * 0.96, a.phi0, dphi * 1.03, bw * 1.25, 12, sh));
    }
    let fade = (0.02 + 0.98 * env) * (1 - swallow) * dop;
    /* v11 径向亮度梯度：内缘（k≈1.1）满亮，外缘（k≈2.7）只剩 38%。
       没有这条，86 条弧在暗底上是「一样亮的一圈圈彩带」；
       有了它，热量从洞里往外衰减，盘才有厚度和温度感。
       白纸版不动 —— 纸上的定标是均匀的，改了就不是那张图了。 */
    if (SKY) {
      const rk = clamp((a.k - 1.06) / 1.64, 0, 1);
      fade *= 1 - 0.52 * rk * rk;
    }
    fade *= (SOLO < 0 ? 1 : (a.solo ? 1 : 0.05));
    a.bd.setAttribute('opacity', Math.max(0, a.op * fade).toFixed(3));
    a.un.setAttribute('opacity', Math.max(0, UN_OP * CFG.T * fade).toFixed(3));

    /* v9-P4 引力红移：俯冲过半后整条压暗一档（离散切换，快运动中不可见） */
    const dark = plunging && pe > 0.45;
    if (dark !== a.dark) {
      a.dark = dark;
      a.bd.setAttribute('fill', dark ? DARKB[a.band] : BANDS[a.band]);
    }

    /* v9-P1 / v10：弯折像只保留一阶。二阶、三阶在盘面上没有对比度可读 ——
       4.7px/单位的缩放下，三层 26 单位间隔的淡带全部融进同色弧里，只是多画路径。
       高阶像改放到「阴影内部」：那里是纯黑底，细环才读得出来（见 gRing3）。
       全部用中线 + 描边（不用填充带），避免径向压缩引起的轮廓自交。 */
    const hGate = smoothstep(0.05, 0.40, -Math.sin(phiMid));
    if (a.h1) {
      if (hGate > 0.002) {
        a.h1.setAttribute('d', centerline(k, a.phi0, dphi, 16, SHFLAT, lensUp));
        a.h1.setAttribute('opacity', Math.max(0, fade * (SKY ? 0.92 : 0.50) * hGate).toFixed(3));
      } else a.h1.setAttribute('opacity', 0);
    }
    if (a.h2) {
      if (hGate > 0.002) {
        a.h2.setAttribute('d', centerline(k, a.phi0, dphi, 13, SHFLAT, lensLow));
        a.h2.setAttribute('opacity', Math.max(0, fade * (SKY ? 0.55 : 0.30) * hGate).toFixed(3));
      } else a.h2.setAttribute('opacity', 0);
    }
  }
  /* 深度重排：每 8 帧一次。顺序几乎不变，插排很便宜 */
  if (--orderTick <= 0) {
    orderTick = 8;
    for (let i = 1; i < arcs.length; i++) {
      const a = arcs[i], ka = depthKey(a);
      let j = i - 1;
      while (j >= 0 && depthKey(arcs[j]) > ka) { arcs[j + 1] = arcs[j]; j--; }
      arcs[j + 1] = a;
    }
    /* 前后两组各排各的：垫色组在填色组底下，插排顺序保持一致 */
    const fb = document.createDocumentFragment(), fbu = document.createDocumentFragment();
    const ff = document.createDocumentFragment(), ffu = document.createDocumentFragment();
    for (const a of arcs) {
      const F = isFrontArc(a);
      (F ? ff : fb).appendChild(a.bd);
      (F ? ffu : fbu).appendChild(a.un);
    }
    gBackU.appendChild(fbu);  gBack.appendChild(fb);
    gFrontU.appendChild(ffu); gFront.appendChild(ff);
  }
  updRing();   /* v10：光子环脉动 + 热点滑行，与主盘共用同一个 clock */
  updFlow();   /* v12：吸积流线沿路径向内推进 */
}

function startMotion() {
  if (moving) return;
  moving = true;
  for (const a of arcs) a.home = a.phi0;
  renderFlow();
  /* v9：整组均匀缩放的「呼吸」已删除 —— 均匀缩放读作整体缩放而非盘体搏动。
     现在的呼吸是径向差分的（renderFlow 内 brA/brPh）：内缘 ±0.9%、按 1/k
     向外衰减，且与坠落/公转共用同一时钟，不会有两组缩放互相打架。 */
}
function stopMotion() {
  moving = false;
  gsap.killTweensOf([gBack, gFront]);
  gsap.set([gBack, gFront], { scale: 1 });
}

/* ---------------- 入场 ----------------
   入场是「出现」不是「位移」，按 AUDIT 的决策顺序用 ease-out（起步快、尾巴长），
   并且两条属性错开 0.16s：先拉长、再补条数，避免所有东西同时冒出来。 */
function drawIntro(p) {
  const S = 0.10 + 0.90 * EASE_OUT(clamp(p * 1.04, 0, 1));
  const N = 0.10 + 0.90 * EASE_OUT(clamp((p - 0.06) * 1.06, 0, 1));
  for (const a of arcs) {
    const on = a.birth <= N;
    a.bd.style.display = on ? '' : 'none';
    a.un.style.display = (on && !a.front) ? '' : 'none';
    if (on) drawArc(a, S);
  }
}
function drawFinal() {
  for (const a of arcs) {
    a.bd.style.display = '';
    a.un.style.display = a.front ? 'none' : '';
    drawArc(a, 1);
  }
}

const st = { p: 0 };
gsap.set([gDebBack, gDebFront], { opacity: 0 });   /* 入场前碎片隐身，1.0s 后随盘浮现 */
const intro = gsap.timeline({ paused: true })
  /* 本体先出场：淡入 + 轻微放大（球心局部坐标 770 768），
     主角亮相 0.15s 之后弧线才开始涌出 */
  .fromTo(gBodyIn, { opacity: 0, scale: 0.82 },
    { opacity: 1, scale: 1, duration: 0.9, ease: 'power2.out',
      svgOrigin: '770 768' }, 0)
  .to(st, { p: 1, duration: 2.0, ease: 'none',
    onUpdate: () => drawIntro(st.p), onComplete: startMotion }, 0.15)
  /* v9：碎片层在盘成形过半后淡入（1.0s 起、1.6s 到位） */
  .fromTo([gDebBack, gDebFront], { opacity: 0 },
    { opacity: 1, duration: 1.6, ease: 'none' }, 1.0)
  /* v9：光子环不属于本体入场层（本体从 82% 放大），单独淡入，
     否则前 0.9s 环会浮在缩小中的球外面。v10 热点层同理同步淡入。 */
  .fromTo([gPhoton, gBeadL], { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'none' }, 0.55)
  /* v12：流线晚一点进来 —— 先看见盘成形，再看见它开始往里流 */
  .fromTo(gFlow, { opacity: 0 }, { opacity: 1, duration: 1.1, ease: 'none' }, 1.35);

/* ---------------- 控件 ---------------- */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const P = { on: true, speed: RM ? 0.5 : 1, line: false };
const bPlay = document.getElementById('bPlay');
bPlay.onclick = () => {
  P.on = !P.on;
  gsap.globalTimeline.paused(!P.on);
  bPlay.textContent = P.on ? '暂停' : '播放';
  bPlay.classList.toggle('on', P.on);
};
document.getElementById('bReplay').onclick = () => {
  stopMotion(); clock = 0; flow = 0; st.p = 0;
  for (const a of arcs) a.phi0 = a.home;
  intro.restart(true);
  gsap.globalTimeline.paused(false); P.on = true;
  bPlay.textContent = '暂停'; bPlay.classList.add('on');
};
const sp = { s05: 0.5, s1: 1, s2: 2 };
for (const id in sp) {
  document.getElementById(id).onclick = () => {
    P.speed = sp[id];
    gsap.globalTimeline.timeScale(P.speed);
    for (const j in sp) document.getElementById(j).classList.toggle('on', j === id);
  };
}
/* 系统开了「减少动效」时降速，界面上的档位也跟着改，别让按钮显示的和实际跑的不一致 */
if (RM) {
  gsap.globalTimeline.timeScale(P.speed);
  document.getElementById('s05').classList.add('on');
  document.getElementById('s1').classList.remove('on');
}
const setInk = on => { for (const a of arcs) a.bd.setAttribute('stroke-width', on ? a.iw.toFixed(1) : 0); };
const bLine = document.getElementById('bLine');
/* 默认开：原图里的深紫轮廓是主体的一部分，去掉之后整盘会散成彩带。
   现在的描边是「一条一笔、剪纸式分层」，不是以前那种把所有描边压到底下
   再被填色盖成毛边的做法 —— 所以它不再降低质感。?noink 可看无墨线版。 */
P.line = location.search.includes('ink');
bLine.classList.toggle('on', P.line);
setInk(P.line);
bLine.onclick = () => {
  P.line = !P.line;
  bLine.classList.toggle('on', P.line);
  setInk(P.line);
};
if (location.search.includes('clean')) {                /* ?clean 出图时藏掉控件条 */
  document.querySelector('.bar').style.display = 'none';
  document.getElementById('stage').style.width = 'min(96vh,94vw)';
}
const bOrbit = document.getElementById('bOrbit');
bOrbit.onclick = () => {
  const on = gOrbit.style.display !== 'none';
  gOrbit.style.display = on ? 'none' : 'block';
  hole.setAttribute('opacity', on ? 0.22 : 0);
  bOrbit.classList.toggle('on', !on);
};

/* v9 真实模式：藏五官只留球 + 光子环 —— 写实元素与卡通脸互不干扰。
   ?real 可直达（截图/对比用）。 */
const bReal = document.getElementById('bReal');
const setReal = on => {
  gBodyFace.style.display = on ? 'none' : '';
  bReal.classList.toggle('on', on);
};
setReal(location.search.includes('real'));
bReal.onclick = () => setReal(gBodyFace.style.display !== 'none');

const ro = document.getElementById('ro');
let fc = 0, fm = 0;
gsap.ticker.add((t, dtMs) => {
  if (moving && P.on) {
    const dts = Math.min(dtMs / 1000, 0.05) * P.speed;   /* 夹住 dt，切标签页回来不会瞬移 */
    clock += dts;
    /* 全局节奏：整盘共享一个很慢的强弱起伏（±8%，周期 ~15s）。
       必须乘在「时间增量」上再积分，不能直接乘到相位上 ——
       否则相位会被正弦倒推回去，出现倒退抖动。 */
    flow += dts * (1 + 0.08 * Math.sin(clock * 0.42));
    renderFlow();
    updDebris(dts);        /* v9-P3：碎片螺旋坠入 */
    updStream(dts);        /* v9-P3：潮汐流事件 */
  }
  fc++;
  if (t - fm > 600) {
    ro.textContent = Math.round(fc * 1000 / (t - fm)) + 'fps · ' + arcs.length + ' 笔 · v12 · 碎屑 ' + DEBN + ' · 压扁 ' + SQ.toFixed(2);
    fc = 0; fm = t;
  }
});

/* ---------------- 启动 ---------------- */
for (const a of arcs) a.home = a.phi0;
const mT = location.search.match(/[?&]t=([\d.]+)/);
/* v9 调试：?deb=秒 把碎片推进到第 N 秒（验证坠落分布）；
   ?str=0~1 把潮汐流定格在生命周期 0~1 处（验证长带造型）。 */
const mDeb = location.search.match(/[?&]deb=([\d.]+)/);
if (mDeb) updDebris(parseFloat(mDeb[1]));
const mStr = location.search.match(/[?&]str=([\d.]+)/);
if (mStr) { STR.on = true; STR.t = parseFloat(mStr[1]) * STR.dur; updStream(0); }
if (location.search.includes('freeze')) { P.on = false; }   /* 定格用：不让 ticker 推进 */
if (location.search.includes('steady')) {
  drawFinal(); moving = true;
  gsap.set(gBodyIn, { opacity: 1, scale: 1 });   /* 直达稳态：跳过入场，主体必须直接在场 */
  gsap.set([gPhoton, gBeadL], { opacity: 1 });   /* v9：光子环同步在场（v10 含热点层） */
  gsap.set(gFlow, { opacity: 1 });               /* v12：流线同步在场 */
  gsap.set([gDebBack, gDebFront], { opacity: 1 });  /* v9：碎片同步在场 */
  if (mT) { clock = flow = parseFloat(mT[1]); renderFlow(); }
} else if (mT) {
  const T = parseFloat(mT[1]);
  intro.progress(Math.min(1, T / 2.15));
  if (T >= 2.15) { drawFinal(); moving = true; gsap.set(gBodyIn, { opacity: 1, scale: 1 }); gsap.set([gPhoton, gBeadL], { opacity: 1 }); gsap.set(gFlow, { opacity: 1 });
    clock = flow = T - 2.15; renderFlow(); }
} else {
  drawIntro(0);
  intro.play(0);
}
</script>
</body>
</html>
