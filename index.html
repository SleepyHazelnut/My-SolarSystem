<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个人主页</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main class="hero">
    <!-- 角色由 src/core/registry.js 按 data-character 自动挂载。
         舞台尺寸（宽高比 + 宽度）在 src/main.js 的 registerCharacter 一行给出。 -->
    <!-- 必须走 HTTP 打开（npm run dev）—— file:// 下模块与素材会被浏览器拦掉 -->
    <div class="stage" data-character="sun"></div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
