<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个人主页</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main class="hero">
    <!-- 三个角色的 SVG 分别由 src/characters/{sun,earth,moon}/index.js 注入；aria-label 写在注入的 <svg> 上 -->
    <!-- 必须走 HTTP 打开（npm run dev）—— file:// 下模块与素材会被浏览器拦掉 -->
    <div class="sun-stage" id="sun"></div>
    <div class="earth-stage" id="earth"></div>
    <div class="moon-stage" id="moon"></div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
