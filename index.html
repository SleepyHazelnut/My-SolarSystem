<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个人主页</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main class="hero">
    <!-- 星系平面图：太阳居中，行星在同心轨道上。
         轨道圈由 `src/main.js` 按它的 `RINGS` 生成，插在本块最前面（在球下面）。
         舞台的位置与尺寸由 `src/core/registry.js` 从那张角色表换算。
         DOM 顺序 = 绘制顺序（后声明者在上）：四颗巨行星排在内圈之前，
         免得它们的球盖住内圈的角色。 -->
    <!-- 必须走 HTTP 打开（npm run dev）—— file:// 下模块与素材会被浏览器拦掉 -->
    <div class="stage" data-character="sun"></div>
    <div class="stage" data-character="jupiter"></div>
    <div class="stage" data-character="saturn"></div>
    <div class="stage" data-character="uranus"></div>
    <div class="stage" data-character="neptune"></div>
    <div class="stage" data-character="mercury"></div>
    <div class="stage" data-character="venus"></div>
    <div class="stage" data-character="earth"></div>
    <div class="stage" data-character="moon"></div>
    <div class="stage" data-character="mars"></div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
