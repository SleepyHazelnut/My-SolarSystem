<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个人主页</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main class="hero">
    <!-- 星系平面图：太阳居中，行星在同心轨道上。
         轨道圈与每个角色的位置、大小都由 src/core/registry.js 从 src/main.js 的
         registerCharacter 参数换算，这里只放占位元素。 -->
    <!-- 必须走 HTTP 打开（npm run dev）—— file:// 下模块与素材会被浏览器拦掉 -->
    <div class="orbit" data-orbit="mercury"></div>
    <div class="orbit" data-orbit="venus"></div>
    <div class="orbit" data-orbit="earth"></div>
    <div class="orbit" data-orbit="mars"></div>
    <div class="orbit" data-orbit="jupiter"></div>
    <div class="orbit" data-orbit="saturn"></div>
    <div class="orbit" data-orbit="uranus"></div>
    <div class="orbit" data-orbit="neptune"></div>
    <div class="orbit" data-orbit="moon"></div>

    <!-- DOM 顺序 = 绘制顺序（后声明者在上）。四颗巨行星排在内圈之前，
         免得它们的球盖住内圈的角色。 -->
    <div class="stage" data-character="sun"></div>
    <div class="stage" data-character="jupiter"></div>
    <div class="stage" data-character="saturn"></div>
    <div class="stage" data-character="uranus"></div>
    <div class="stage" data-character="neptune"></div>
    <div class="stage" data-character="mercury"></div>
    <div class="stage" data-character="venus"></div>
    <div class="stage" data-character="earth"></div>
    <div class="stage" data-character="moon"></div>
    <div class="stage" data-character="mars"></div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
